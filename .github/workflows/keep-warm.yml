name: Keep server warm

# Render's free tier puts the service to sleep after ~15 minutes of no traffic,
# causing a 10-60s cold-start on the next real request. This pings /health every
# 10 minutes so real users (and App Store reviewers) never hit a cold start.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf --max-time 30 https://nextrep-server.onrender.com/health || true
